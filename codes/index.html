<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloxdio Cannoli</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="background"></div>

    <div class="section-cont">
        <div class="section" data-section="search">
            <h1>Codes</h1>

            <h2>Navigation</h2>
            <ul>
                <li><a href="/">Back</a></li>
            </ul>

            <h2>Search by text</h2><br>
            <div class="searchInput-container">
                <input type="text" placeholder="" id="codesSearchInput">
                <button id="clearSearch" class="submitBtn clearSearch">x</button>
                <button id="submitSearch" class="submitBtn">Search</button>
            </div>

            <h2>Search by tags</h2><br>
            <div id="selectTags">
                <div id="removeTagFilter" class="buttonRow inline">

                </div>
                <span id="tagDivider" class="tagDivider">&nbsp;</span>
                <div id="addTagFilter" class="buttonRow inline">

                </div>
            </div>
        </div>

        <div id="codeSearchOutput">

        </div>

    </div>

    <script src="/script.js"></script>
</body>
